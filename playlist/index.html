<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LoopLab — AI Playlist</title>
  <meta name="description" content="Check out this playlist on LoopLab" />

  <!-- Open Graph for WhatsApp/iMessage link previews -->
  <meta property="og:type" content="music.playlist" />
  <meta property="og:site_name" content="LoopLab AI" />
  <meta property="og:title" content="LoopLab AI Playlist" />
  <meta property="og:description" content="Check out this playlist on LoopLab" />
  <meta property="og:image" content="https://getlooplab.app/og-image.png" />

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0A0A0A; color: #fff;
      min-height: 100vh; display: flex; flex-direction: column;
      align-items: center; justify-content: flex-start;
      padding: 24px;
    }
    .card {
      width: 100%; max-width: 420px;
      background: linear-gradient(135deg, #1a1a2e, #16213e);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 24px; padding: 32px 24px;
      text-align: center; margin-top: 40px;
    }
    .logo { font-size: 13px; font-weight: 700; letter-spacing: 2px; color: rgba(255,255,255,0.4); margin-bottom: 28px; }
    .album-art {
      width: 120px; height: 120px; border-radius: 20px;
      background: linear-gradient(135deg, #FFB347, #FF7A1A, #FF4F8B);
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 20px; font-size: 48px;
    }
    .title { font-size: 22px; font-weight: 700; letter-spacing: -0.5px; margin-bottom: 8px; }
    .meta { font-size: 14px; color: rgba(255,255,255,0.45); margin-bottom: 24px; }
    .btn-primary {
      display: flex; align-items: center; justify-content: center; gap: 10px;
      width: 100%; padding: 16px; border-radius: 50px;
      background: #fff; color: #000;
      font-size: 16px; font-weight: 700; text-decoration: none;
      margin-bottom: 12px; border: none; cursor: pointer;
      transition: opacity 0.2s;
    }
    .btn-primary:hover { opacity: 0.9; }
    #status { font-size: 13px; color: rgba(255,255,255,0.4); margin-top: 8px; min-height: 20px; }
    .songs { margin-top: 24px; text-align: left; }
    .song-row {
      display: flex; align-items: center; gap: 12px;
      padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,0.06);
    }
    .song-num { font-size: 12px; color: rgba(255,255,255,0.35); width: 20px; text-align: center; flex-shrink: 0; }
    .song-info { flex: 1; min-width: 0; }
    .song-name { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .song-artist { font-size: 12px; color: rgba(255,255,255,0.4); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .divider { color: rgba(255,255,255,0.2); font-size: 12px; margin: 20px 0 12px; }
    .store-buttons { display: flex; gap: 10px; }
    .store-btn {
      flex: 1; padding: 12px 8px; border-radius: 14px;
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.12);
      color: #fff; font-size: 13px; font-weight: 600;
      text-decoration: none; text-align: center;
      transition: background 0.2s;
    }
    .store-btn:hover { background: rgba(255,255,255,0.12); }
    .footer { margin: 28px 0; font-size: 12px; color: rgba(255,255,255,0.2); }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">LOOPLAB AI</div>
    <div class="album-art">🎧</div>
    <div class="title" id="plTitle">AI Playlist</div>
    <div class="meta" id="plMeta">Loading...</div>

    <button class="btn-primary" onclick="openInApp()">▶ Open in LoopLab</button>
    <div id="status"></div>

    <div class="songs" id="songs"></div>

    <div class="divider">— Don't have the app? —</div>
    <div class="store-buttons">
      <a class="store-btn" href="https://apps.apple.com/app/id6774776556">🍎 App Store</a>
      <a class="store-btn" href="https://play.google.com/store/apps/details?id=com.looplab.app">🤖 Play Store</a>
    </div>
  </div>

  <div class="footer">Made with LoopLab AI · getlooplab.app</div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const pathParts = window.location.pathname.split('/').filter(Boolean);
    const playlistId = params.get('id') || pathParts[pathParts.length - 1];

    if (playlistId && playlistId !== 'playlist') {
      fetch(`https://discerning-emotion-production-43dd.up.railway.app/social/playlist/${playlistId}`)
        .then(r => r.json())
        .then(data => {
          const pl = data.playlist;
          if (!pl) throw new Error('not found');
          document.getElementById('plTitle').textContent = pl.title || 'AI Playlist';
          document.title = `${pl.title} — LoopLab AI`;
          const songs = pl.songs || [];
          document.getElementById('plMeta').textContent =
            `${songs.length} song${songs.length === 1 ? '' : 's'}` +
            (pl.username ? ` · @${pl.username}` : '');
          const container = document.getElementById('songs');
          container.innerHTML = songs.slice(0, 30).map((s, i) => `
            <div class="song-row">
              <div class="song-num">${i + 1}</div>
              <div class="song-info">
                <div class="song-name">${(s.title || '').replace(/</g, '&lt;')}</div>
                <div class="song-artist">${(s.artist || '').replace(/</g, '&lt;')}</div>
              </div>
            </div>`).join('');
        })
        .catch(() => {
          document.getElementById('plMeta').textContent = 'Playlist not found or is private.';
        });
    }

    function openInApp() {
      const deepLink = `looplab://playlist/${playlistId}`;
      const status = document.getElementById('status');
      status.textContent = 'Opening LoopLab...';
      window.location.href = deepLink;
      setTimeout(() => { status.textContent = "App not installed? Download below ↓"; }, 2000);
    }

    const isMobile = /iPhone|iPad|Android/i.test(navigator.userAgent);
    if (isMobile && playlistId) setTimeout(() => openInApp(), 500);
  </script>
</body>
</html>
