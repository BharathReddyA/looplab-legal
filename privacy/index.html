<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Legal — LoopLab</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #080808; --surface: #0f0f0f; --border: #1c1c1c;
      --border-light: #242424; --text: #e8e8e8; --muted: #888; --dim: #555;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg); color: var(--text);
      min-height: 100vh; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 40px 24px;
      -webkit-font-smoothing: antialiased;
    }
    .logo {
      font-family: 'Syne', sans-serif; font-weight: 800; font-size: 22px;
      color: #fff; letter-spacing: -0.5px; margin-bottom: 8px;
    }
    .tagline { font-size: 13px; color: var(--dim); margin-bottom: 48px; }
    h2 {
      font-family: 'Syne', sans-serif; font-size: 13px; font-weight: 600;
      color: var(--dim); letter-spacing: 0.08em; text-transform: uppercase;
      margin-bottom: 16px;
    }
    .cards { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; width: 100%; max-width: 480px; }
    .card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 10px; padding: 24px;
      text-decoration: none; color: inherit;
      transition: border-color 0.15s, background 0.15s;
      display: block;
    }
    .card:hover { border-color: var(--border-light); background: #131313; }
    .card-icon { font-size: 22px; margin-bottom: 12px; }
    .card-title {
      font-family: 'Syne', sans-serif; font-size: 15px; font-weight: 700;
      color: #fff; margin-bottom: 6px;
    }
    .card-desc { font-size: 12.5px; color: var(--muted); line-height: 1.6; }
    .updated { font-size: 11px; color: var(--dim); margin-top: 10px; }
    .footer { margin-top: 40px; font-size: 12px; color: var(--dim); }
    .footer a { color: var(--muted); text-decoration: none; }
    .footer a:hover { color: var(--text); }
    @media (max-width: 400px) { .cards { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div class="logo">LoopLab</div>
  <div class="tagline">AI-powered music, built for Indian music lovers</div>
  <h2>Legal</h2>
  <div class="cards">
    <a class="card" href="privacy-policy.html">
      <div class="card-icon">🔒</div>
      <div class="card-title">Privacy Policy</div>
      <div class="card-desc">How we collect, use, and protect your personal data.</div>
      <div class="updated">Updated May 29, 2026</div>
    </a>
    <a class="card" href="terms-of-service.html">
      <div class="card-icon">📄</div>
      <div class="card-title">Terms of Service</div>
      <div class="card-desc">Rules and guidelines for using the LoopLab app.</div>
      <div class="updated">Updated May 29, 2026</div>
    </a>
  </div>
  <div class="footer">
    Questions? <a href="mailto:support@looplab.app">support@looplab.app</a>
  </div>
</body>
</html>
